<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Đăng ký tài khoản</title>
    <link rel="stylesheet" href="/CSS/style.css" />
    <link rel="stylesheet" href="/CSS/register.css" />
  </head>
  <body>
    <section class="register-section">
      <div class="form-container">
        <h2>Đăng ký tài khoản</h2>
        <form id="registerForm">
          <div class="form-group">
            <label for="username">Tên đăng nhập</label>
            <input
              type="text"
              id="username"
              name="username"
              placeholder="Nhập tên đăng nhập"
              required
            />
          </div>
          <div class="form-group">
            <label for="email">Email</label>
            <input
              type="email"
              id="email"
              name="email"
              placeholder="Nhập email"
              required
            />
          </div>
          <div class="form-group">
            <label for="password">Mật khẩu</label>
            <input
              type="password"
              id="password"
              name="password"
              placeholder="Nhập mật khẩu"
              required
            />
          </div>
          <div class="form-group">
            <label for="confirmPassword">Xác nhận mật khẩu</label>
            <input
              type="password"
              id="confirmPassword"
              name="confirmPassword"
              placeholder="Nhập lại mật khẩu"
              required
            />
          </div>
          <div class="form-group">
            <label for="date_of_birth">Ngày sinh</label>
            <input
              type="date"
              id="date_of_birth"
              name="date_of_birth"
              required
            />
          </div>
          <div class="form-group">
            <label for="address">Địa chỉ</label>
            <input
              type="text"
              id="address"
              name="address"
              placeholder="Nhập địa chỉ của bạn"
              required
            />
          </div>
          <div class="form-group">
            <label for="phone_number">Số điện thoại</label>
            <input
              type="tel"
              id="phone_number"
              name="phone_number"
              placeholder="Nhập số điện thoại"
              required
            />
          </div>
          <div class="form-group">
            <label for="rank">Cấp bậc</label>
            <select id="rank" name="user_rank" required>
              <option value="user">Bronze</option>
              <option value="vip">Silver</option>
              <option value="admin">Gold</option>
            </select>
          </div>
          <button type="submit" class="btn">Đăng ký</button>
          <p class="form-footer">
            Đã có tài khoản? <a href="login.html">Đăng nhập ngay</a>
          </p>
        </form>
      </div>
    </section>

    <script src="/public/script.js" defer></script>
  </body>
</html>
