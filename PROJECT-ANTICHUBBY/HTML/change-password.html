<!DOCTYPE html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <title>Đổi mật khẩu</title>
    <link rel="stylesheet" href="/CSS/style.css" />
    <link rel="stylesheet" href="/CSS/chgpass.css" />
  </head>
  <body>
    <div class="container">
      <h2>Đổi mật khẩu</h2>
      <form id="changePassForm">
        <label>Mật khẩu hiện tại:</label><br />
        <input type="password" name="current" required /><br />

        <label>Mật khẩu mới:</label><br />
        <input type="password" name="new" required /><br />

        <label>Xác nhận mật khẩu mới:</label><br />
        <input type="password" name="confirm" required /><br /><br />

        <button type="submit">Xác nhận</button>
      </form>
      <p id="message" style="color: red"></p>
    </div>

    <script>
      document
        .getElementById("changePassForm")
        .addEventListener("submit", function (e) {
          e.preventDefault();
          const newPass = e.target.new.value;
          const confirm = e.target.confirm.value;
          const message = document.getElementById("message");

          if (newPass !== confirm) {
            message.textContent = "Mật khẩu xác nhận không khớp.";
          } else {
            message.style.color = "green";
            message.textContent = "Đổi mật khẩu thành công! (giả lập)";
          }
        });
    </script>
  </body>
</html>
